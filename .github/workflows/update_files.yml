name: update_files
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: generate v0
        run: |
          python -m src.main_v0
      - name: generate v1
        run: |
          python -m src.v1.main_v1
      - name: generate VitePress pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python docs/vitepress.py
      - name: readme
        run: |
          python -m readme.readme
      - name: jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: counting
        run: |
          echo "COUNT=$(jq '.SpectralIndices | length' ./output/spectral-indices-dict.json)" >> $GITHUB_ENV
      - name: badge
        uses: schneegans/dynamic-badges-action@v1.0.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5e9f08fa6a45d9d486e29d9d85ad5c84
          filename: spectral.json
          label: Spectral Indices
          message: ${{ env.COUNT }}
          color: purple
      - name: commit
        continue-on-error: true
        run: |
          today=$(date +"%Y-%m-%d %H:%M:%S")
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Updated files ${today} UTC" -a
      - name: push
        continue-on-error: true
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
